name: QA Automation CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            pytest_args: "--browser chromium"
            browser_pkg: chromium      # 다운로드할 Playwright 브라우저 바이너리
            deps_pkg: chromium         # install-deps 대상 (시스템 공유 라이브러리)
          - browser: firefox
            pytest_args: "--browser firefox"
            browser_pkg: firefox
            deps_pkg: firefox
          - browser: msedge
            pytest_args: "--browser chromium --browser-channel msedge"
            browser_pkg: ""            # 러너에 사전 설치된 Edge 사용 → 바이너리 다운로드 생략
            deps_pkg: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Playwright 브라우저는 버전별로 캐시 (공식 CI 권장 패턴)
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(grep -oP '^playwright==\K.*' requirements.txt)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      # 브라우저 바이너리는 캐시 미스일 때만 다운로드. msedge는 러너 내장 Edge를
      # 쓰므로 browser_pkg가 비어 있어 이 스텝을 건너뜀(13분 다운로드 제거).
      - name: Install Playwright browser binary (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true' && matrix.browser_pkg != ''
        run: python -m playwright install ${{ matrix.browser_pkg }}
      # 시스템 공유 라이브러리는 캐시되지 않으므로 매번 설치(apt). Edge도 Chromium
      # 기반이라 chromium deps로 충분.
      - name: Install Playwright system deps
        run: python -m playwright install-deps ${{ matrix.deps_pkg }}

      - name: Run tests
        run: pytest ${{ matrix.pytest_args }} -n auto
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'Admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/

  allure-report:
    name: Publish Allure report
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Allure results (all browsers)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-artifacts
      - name: Merge results into one folder
        run: |
          mkdir -p allure-results
          cp -r allure-artifacts/*/. allure-results/ 2>/dev/null || true
      - name: Load previous report (for trend history)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Restore history into results
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi
      - name: Set up JDK (Allure CLI runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Allure CLI
        run: |
          curl -sSL -o allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.30.0/bin" >> "$GITHUB_PATH"
      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
